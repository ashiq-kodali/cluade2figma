<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1915"/>
      <stop offset="1" stop-color="#2a211b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f2c46d"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="978" y1="0" x2="1026" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#a259ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- Title block -->
  <g transform="translate(72 96)">
    <rect width="56" height="56" rx="14" fill="#d97757"/>
    <rect x="14" y="14" width="28" height="28" rx="3" fill="none" stroke="#fff" stroke-width="3.5"/>
    <path d="M21 14v-6M35 14v-6M21 48v-6M35 48v-6M14 21h-6M14 35h-6M48 21h-6M48 35h-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="118" font-size="54" font-weight="800" fill="#faf7f2" letter-spacing="-1.5">Claude Design <tspan fill="#d97757">→</tspan> Figma</text>
    <text x="0" y="164" font-size="22" fill="#cfc8bd">Pick a frame. Copy it. Press <tspan font-weight="700" fill="#faf7f2">⌘V</tspan> in Figma.</text>
    <text x="0" y="196" font-size="22" fill="#cfc8bd">Editable layers, no Figma plugin.</text>
    <g transform="translate(0 228)" font-size="14" font-weight="600">
      <rect width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="74" y="21" text-anchor="middle" fill="#e9e3d9">Chrome · MV3</text>
      <rect x="160" width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="240" y="21" text-anchor="middle" fill="#e9e3d9">Zero dependencies</text>
      <rect x="332" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="407" y="21" text-anchor="middle" fill="#e9e3d9">Plain clipboard</text>
    </g>
  </g>

  <!-- Browser card with picked frame -->
  <g transform="translate(700 70)" filter="url(#shadow)">
    <rect width="260" height="280" rx="14" fill="#f4f1ea"/>
    <rect width="260" height="30" rx="14" fill="#e6e1d6"/>
    <rect y="16" width="260" height="14" fill="#e6e1d6"/>
    <circle cx="18" cy="15" r="5" fill="#ec6a5e"/><circle cx="34" cy="15" r="5" fill="#f4bf4f"/><circle cx="50" cy="15" r="5" fill="#61c554"/>
    <!-- picked card -->
    <g transform="translate(28 52)">
      <rect width="204" height="204" rx="12" fill="#fff" stroke="#e5e2da"/>
      <circle cx="30" cy="30" r="14" fill="#7aa2c9"/>
      <rect x="52" y="20" width="96" height="9" rx="4.5" fill="#3a3530"/>
      <rect x="52" y="34" width="68" height="7" rx="3.5" fill="#b8b2a8"/>
      <rect x="16" y="56" width="172" height="64" rx="9" fill="url(#hero)"/>
      <rect x="16" y="132" width="160" height="7" rx="3.5" fill="#cfc9be"/>
      <rect x="16" y="146" width="132" height="7" rx="3.5" fill="#cfc9be"/>
      <rect x="112" y="168" width="76" height="24" rx="7" fill="#1f1e1d"/>
      <rect x="16" y="172" width="48" height="16" rx="8" fill="none" stroke="#d97757" stroke-dasharray="3 2"/>
      <!-- picker outline -->
      <rect x="-5" y="-5" width="214" height="214" rx="15" fill="none" stroke="#d97757" stroke-width="2.5"/>
      <rect x="-5" y="-27" width="140" height="20" rx="5" fill="#d97757"/>
      <text x="4" y="-13" font-size="11" font-weight="700" fill="#fff">Profile card · 340×412</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(978 210)">
    <path d="M0 0 H44" stroke="#c2694e" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 -9 L48 0 L36 9" fill="none" stroke="#a259ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="-18" text-anchor="middle" font-size="13" font-weight="700" fill="#e9e3d9">⌘V</text>
  </g>

  <!-- Figma-ish canvas with layers -->
  <g transform="translate(1040 70)" filter="url(#shadow)">
    <rect width="190" height="280" rx="14" fill="#2c2c2c"/>
    <text x="16" y="28" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.9">Layers</text>
    <g font-size="11" fill="#e6e6e6">
      <rect x="8" y="42" width="174" height="24" rx="5" fill="#a259ff" fill-opacity="0.35"/>
      <text x="16" y="58"># Profile card</text>
      <text x="30" y="84" fill-opacity="0.85"># Head</text>
      <text x="44" y="106" fill-opacity="0.75">▣ Avatar</text>
      <text x="44" y="128" fill-opacity="0.75">T  Ada Lovelace</text>
      <text x="30" y="150" fill-opacity="0.85">▭ Hero</text>
      <text x="30" y="172" fill-opacity="0.85">T  Design systems…</text>
      <text x="30" y="194" fill-opacity="0.85"># Row</text>
      <text x="44" y="216" fill-opacity="0.75">✎ Arrow icon</text>
      <text x="44" y="238" fill-opacity="0.75">T  Continue</text>
      <text x="30" y="260" fill-opacity="0.85">▭ Email input</text>
    </g>
  </g>
</svg>
